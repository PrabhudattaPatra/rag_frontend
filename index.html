<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI University Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-gradients">
        <div class="gradient gradient-1"></div>
        <div class="gradient gradient-2"></div>
    </div>
    
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">
                <div class="avatar-pulse"></div>
                <div class="avatar-icon">🌌</div>
            </div>
            <div class="header-info">
                <h1>LangGraph Assistant</h1>
                <p>Knowledge Base & Advisory</p>
            </div>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message assistant default-msg">
                <div class="bubble">Hello! I am your University advisory assistant. How can I help you today?</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
